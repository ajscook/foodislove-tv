<style>
  :root {
    --paper: #ffffff;
    --ink: #1a1a1a;
    --ink-soft: #6b6b6b;
    --love-red: #d92c27;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: var(--paper);
  }

  body {
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    font-family: 'Inter', -apple-system, sans-serif;
    color: var(--ink);
    padding: 24px;
  }

  .wrap {
    width: 100%;
    max-width: 460px;
    text-align: center;
  }

  .logo {
    width: 100%;
    max-width: 300px;
    height: auto;
    display: block;
    margin: 0 auto 40px;
  }

  h1 {
    font-family: 'Fraunces', Georgia, serif;
    font-weight: 600;
    font-size: clamp(26px, 6vw, 34px);
    line-height: 1.15;
    letter-spacing: -0.01em;
    margin: 0 0 16px;
    color: var(--ink);
  }

  p.sub {
    font-family: 'Fraunces', Georgia, serif;
    font-style: italic;
    font-weight: 500;
    font-size: clamp(16px, 4vw, 18px);
    line-height: 1.5;
    color: var(--ink-soft);
    margin: 0 0 36px;
  }

  p.sub .accent {
    color: var(--love-red);
    font-style: normal;
    font-weight: 600;
  }

  .cta {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    background: var(--love-red);
    color: #fff;
    text-decoration: none;
    font-family: 'Inter', sans-serif;
    font-weight: 600;
    font-size: 15px;
    padding: 14px 28px;
    border-radius: 999px;
    transition: transform 0.15s ease, box-shadow 0.15s ease;
    box-shadow: 0 1px 2px rgba(0,0,0,0.06);
  }

  .cta:hover {
    transform: translateY(-1px);
    box-shadow: 0 6px 16px rgba(217,44,39,0.25);
  }

  .cta svg { flex-shrink: 0; }

  .platforms-label {
    font-family: 'Fraunces', Georgia, serif;
    font-style: italic;
    font-size: 14px;
    color: var(--ink-soft);
    margin: 32px 0 16px;
  }

  .platforms {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 18px;
  }

  .platforms a {
    display: block;
    width: 52px;
    height: 52px;
    border-radius: 14px;
    overflow: hidden;
    transition: transform 0.15s ease;
  }

  .platforms a:hover {
    transform: translateY(-2px);
  }

  .platforms img {
    width: 100%;
    height: 100%;
    display: block;
    object-fit: cover;
  }

  @media (prefers-reduced-motion: reduce) {
    .platforms a { transition: none; }
  }

  @media (prefers-reduced-motion: reduce) {
    .cta { transition: none; }
  }
</style>
</head>
